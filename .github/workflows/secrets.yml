name: secrets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Scan for secrets in git history and PR diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history scan

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # 上传 SARIF 到 Security tab
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true

  # 额外: secrets.json 出现在 zed/settings*.json 即使在历史里也告警
  history-archive-check:
    name: Verify zed/settings*.json not re-tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail if sensitive files re-appear
        run: |
          # 即使 .gitignore 屏蔽, 检查 git ls-files 不会包含
          if git ls-files | grep -E '^(zed/settings\.json|zed/settings_1\.json|zed/settings_backup\.json|containers/auth\.json|containers/podman-connections\.json|uv/uv-receipt\.json)$'; then
            echo "ERROR: Sensitive file re-tracked. Run git rm --cached and amend."
            exit 1
          fi
          echo "OK: no sensitive files in tracked set."